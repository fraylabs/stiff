name: Release archives
on:
  push:
    branches: [release-0.6.0]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact candidate commit or existing release tag
        required: true
        default: main
        type: string
      publish_hub:
        description: Publish the exact source library to BendHub before verification
        default: false
        type: boolean
      hub_package:
        description: Optional immutable BendHub hash to verify with native consumers
        default: ""
        type: string
      publish:
        description: Upload verified archives to the existing pre-release (tag required)
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  publish_hub:
    if: inputs.publish_hub
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: 1
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Check out exact library source
        run: |
          git init .
          git remote add origin "git@github.com:$GITHUB_REPOSITORY.git"
          git fetch --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cmake patch pkg-config libcurl4-openssl-dev libjson-c-dev libsqlite3-dev python3 openssl
      - run: make setup
      - name: Check library proofs and publish
        run: |
          .cache/toolchain/bin/bend src/PROOF.bend --check-only
          .cache/toolchain/bin/bend stiff.bend --publish > "$RUNNER_TEMP/hub-publication.txt"
          cat "$RUNNER_TEMP/hub-publication.txt"
      - name: Retain publication response
        uses: actions/upload-artifact@v4
        with:
          name: bendhub-publication
          path: ${{ runner.temp }}/hub-publication.txt
          if-no-files-found: error
  package:
    needs: publish_hub
    if: always() && (needs.publish_hub.result == 'success' || needs.publish_hub.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      BEND_NO_TELEMETRY: 1
      STIFF_NATIVE_ABI: compiler
      STIFF_NATIVE_SANITIZE: 0
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact package source
        run: |
          git init .
          git remote add origin "git@github.com:$GITHUB_REPOSITORY.git"
          # Hosted runner checkout uses the public HTTPS endpoint; the stored remote is SSH.
          git fetch --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          if [ "$PUBLISH" = true ]; then
            test "$SOURCE_REF" = "v$(cat VERSION)"
            gh release view "$SOURCE_REF" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease > "$RUNNER_TEMP/prerelease"
            test "$(cat "$RUNNER_TEMP/prerelease")" = true
          fi
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cmake patch pkg-config libcurl4-openssl-dev libjson-c-dev libsqlite3-dev python3 openssl
      - run: make setup
      - name: Build clean archive
        run: python3 scripts/package.py --require-clean
      - name: Verify exact archive
        run: python3 scripts/verify-package.py .cache/dist/*.tar.gz --evidence .cache/dist/verification-${{ matrix.os }}.json
      - name: Verify published BendHub consumers
        if: inputs.hub_package != ''
        env:
          HUB_PACKAGE: ${{ inputs.hub_package }}
        run: |
          cp -R examples/bendhub-client "$RUNNER_TEMP/hub-client"
          make -C "$RUNNER_TEMP/hub-client" setup build
          python3 scripts/verify-bendhub.py "$HUB_PACKAGE" --client-binary "$RUNNER_TEMP/hub-client/build/auth-client" > .cache/dist/bendhub-${{ matrix.os }}.json
          hub_effect="$RUNNER_TEMP/hub-client/.bend/lib/$HUB_PACKAGE/src/effects/stiff.c"
          cp "$hub_effect" "$RUNNER_TEMP/hub-effect-original.c"
          echo '/* deliberate cached-source tamper */' >> "$hub_effect"
          if make -C "$RUNNER_TEMP/hub-client" build > "$RUNNER_TEMP/hub-tamper.log" 2>&1; then
            echo 'Cached source tamper was not rejected'; exit 1
          fi
          grep -q 'Cached package differs from pinned manifest' "$RUNNER_TEMP/hub-tamper.log"
          cp "$RUNNER_TEMP/hub-effect-original.c" "$hub_effect"
          make -C "$RUNNER_TEMP/hub-client" build
      - name: Retain verified build bytes and evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: .cache/dist/*
          if-no-files-found: error
      - name: Upload verified release assets
        if: inputs.publish
        run: gh release upload "$SOURCE_REF" .cache/dist/*.tar.gz .cache/dist/*.sha256 --repo "$GITHUB_REPOSITORY"
