name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, sanitized]
    env:
      STIFF_NATIVE_ABI: ${{ matrix.profile == 'sanitized' && 'standard' || 'compiler' }}
      STIFF_NATIVE_SANITIZE: ${{ matrix.profile == 'sanitized' && 'combined' || '0' }}
    steps:
      - name: Check out the exact public commit
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install native build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make pkg-config libcurl4-openssl-dev libjson-c-dev libevent-dev python3 openssl
      - run: clang --version
      - run: make setup
      - run: make test
