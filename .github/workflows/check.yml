name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm run setup
      - run: npm test
      - name: Install native build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libcurl4-openssl-dev libjson-c-dev
      - run: npm run test:native
